# Конфиг auth-service — подгружается когда spring.application.name=auth-service
# Чувствительные данные (пароли, ключи) НЕ хранятся здесь — только в .env
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    # password берётся из .env → DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  # секрет jwt.secret остаётся в application.properties + .env
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
