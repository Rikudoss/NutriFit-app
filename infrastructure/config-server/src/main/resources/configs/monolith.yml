# Конфиг монолита — подгружается когда spring.application.name=monolith
# Чувствительные данные (пароли, ключи) НЕ хранятся здесь — только в .env
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutrifit_ai}
    username: ${DB_USER:postgres}
    # password берётся из .env → DB_PASSWORD (не из конфиг-сервера)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  # секрет jwt.secret остаётся в application.properties + .env
  expiration-ms: 86400000
