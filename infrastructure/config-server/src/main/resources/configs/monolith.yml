# Конфиг монолита — подгружается когда spring.application.name=monolith
# Чувствительные данные (пароли, ключи) НЕ хранятся здесь — только в .env
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutrifit_ai}
    username: ${DB_USER:postgres}
    # password берётся из .env → DB_PASSWORD (не из конфиг-сервера)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: monolith-user-sync
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Принимать любые пакеты при десериализации — auth-service публикует свой класс,
        # а монолит десериализует в свой kz.nutrifit.backend.auth.event.UserRegisteredEvent
        spring.json.trusted.packages: '*'
        # Не использовать __TypeId__ из заголовка producer-а — он указывает на класс auth-service.
        # Маппим всё в монолитный DTO через value.default.type ниже.
        spring.json.use.type.headers: false
        spring.json.value.default.type: kz.nutrifit.backend.auth.event.UserRegisteredEvent

openai:
  model: gpt-4o-mini
  max-tokens: 4000
  temperature: 0.7

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  # секрет jwt.secret остаётся в application.properties + .env
  expiration-ms: 86400000
