services:

  # ──────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────
  nutrifit-postgres:
    image: postgres:16
    container_name: nutrifit-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nutrifit_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nutrifit_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # pgAdmin 4
  # ──────────────────────────────────────────
  nutrifit-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nutrifit-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nutrifit.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      nutrifit-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────
  nutrifit-redis:
    image: redis:7-alpine
    container_name: nutrifit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Zookeeper (нужен Kafka)
  # ──────────────────────────────────────────
  nutrifit-zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: nutrifit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Kafka 3.7 (Confluent Platform 7.7.0)
  # Два листенера:
  #   PLAINTEXT      → localhost:9092    (Spring-приложения на хосте)
  #   PLAINTEXT_INT  → nutrifit-kafka:29092 (контейнер-контейнер)
  # ──────────────────────────────────────────
  nutrifit-kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: nutrifit-kafka
    depends_on:
      nutrifit-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nutrifit-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INT://nutrifit-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Zipkin (distributed tracing)
  # ──────────────────────────────────────────
  nutrifit-zipkin:
    image: openzipkin/zipkin:latest
    container_name: nutrifit-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ══════════════════════════════════════════
  # SPRING CLOUD INFRASTRUCTURE
  # ══════════════════════════════════════════

  # ──────────────────────────────────────────
  # Config Server (Spring Cloud Config)
  # Раздаёт конфиги клиентам по spring.application.name
  # ──────────────────────────────────────────
  nutrifit-config-server:
    build:
      context: ../
      dockerfile: infrastructure/config-server/Dockerfile
    image: nutrifit-config-server:local
    container_name: nutrifit-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Discovery Server (Eureka)
  # Реестр сервисов: monolith, api-gateway регистрируются здесь
  # ──────────────────────────────────────────
  nutrifit-discovery-server:
    build:
      context: ../
      dockerfile: infrastructure/discovery-server/Dockerfile
    image: nutrifit-discovery-server:local
    container_name: nutrifit-discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: nutrifit-discovery-server
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Monolith (Spring Boot)
  # Подтягивает конфиг с config-server, регистрируется в Eureka
  # ──────────────────────────────────────────
  nutrifit-monolith:
    build:
      context: ../
      dockerfile: services/monolith/Dockerfile
    image: nutrifit-monolith:local
    container_name: nutrifit-monolith
    # Защита: после Шага C.2 монолит доверяет X-User-Id заголовку без JWT-валидации.
    # Порт 8081 НЕ публикуется на host — только expose в nutrifit-network.
    # Снаружи единственная точка входа — Gateway:8080, который и валидирует JWT.
    # Иначе любой клиент мог бы curl-ом на localhost:8081 с кастомным X-User-Id обойти auth.
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nutrifit-postgres:5432/${DB_NAME:-nutrifit_ai}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CONFIG_SERVER_URL: http://nutrifit-config-server:8888
      EUREKA_SERVER_URL: http://nutrifit-discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: nutrifit-monolith
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      KAFKA_BOOTSTRAP: nutrifit-kafka:29092
    depends_on:
      nutrifit-postgres:
        condition: service_healthy
      nutrifit-config-server:
        condition: service_healthy
      nutrifit-discovery-server:
        condition: service_healthy
      nutrifit-kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # Auth Service (Шаг A Фазы 2)
  # Своя БД auth_db. Пока работает параллельно монолиту,
  # Gateway переключится на него в Шаге C.
  # ──────────────────────────────────────────
  nutrifit-auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    image: nutrifit-auth-service:local
    container_name: nutrifit-auth-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nutrifit-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CONFIG_SERVER_URL: http://nutrifit-config-server:8888
      EUREKA_SERVER_URL: http://nutrifit-discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: nutrifit-auth-service
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: nutrifit-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: nutrifit-kafka:29092
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
    depends_on:
      nutrifit-postgres:
        condition: service_healthy
      nutrifit-config-server:
        condition: service_healthy
      nutrifit-discovery-server:
        condition: service_healthy
      nutrifit-redis:
        condition: service_healthy
      nutrifit-kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - nutrifit-network

  # ──────────────────────────────────────────
  # API Gateway (Spring Cloud Gateway)
  # Проксирует /api/** → lb://monolith через Eureka
  # ──────────────────────────────────────────
  nutrifit-api-gateway:
    build:
      context: ../
      dockerfile: services/api-gateway/Dockerfile
    image: nutrifit-api-gateway:local
    container_name: nutrifit-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://nutrifit-discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: nutrifit-api-gateway
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Общий JWT_SECRET с auth-service и монолитом — Gateway валидирует подпись локально
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      nutrifit-discovery-server:
        condition: service_healthy
      nutrifit-monolith:
        condition: service_healthy
      nutrifit-auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - nutrifit-network

# ──────────────────────────────────────────
networks:
  nutrifit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
