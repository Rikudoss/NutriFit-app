server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS — настроен здесь, монолит свой CorsConfig может отключить после 1.7
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "${ALLOWED_ORIGINS:http://localhost:3000}"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

          routes:
            # Весь /api/** → монолит, найденный через Eureka (lb:// = client-side load balancing)
            - id: monolith
              uri: lb://monolith
              predicates:
                - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
