server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS — настроен здесь, монолит свой CorsConfig может отключить после 1.7
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "${ALLOWED_ORIGINS:http://localhost:3000}"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

          routes:
            # ВАЖНО: порядок имеет значение — специфичные пути идут выше,
            # иначе /api/** перехватит их до того, как сработает нужный предикат.
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: user-service-profile
              uri: lb://user-service
              predicates:
                - Path=/api/profile/**
            - id: user-service-onboarding
              uri: lb://user-service
              predicates:
                - Path=/api/onboarding/**
            - id: monolith
              uri: lb://monolith
              predicates:
                - Path=/api/**

jwt:
  # Общий секрет с auth-service и монолитом — Gateway валидирует JWT локально (без вызова auth-service).
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
